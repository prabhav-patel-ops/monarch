name: AI Team Approved Task Bridge

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  prepare-task:
    if: ${{ startsWith(github.event.issue.title, '[APPROVED]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Create deterministic task branch and handoff comment
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            const branch = `task/issue-${issue.number}`;

            const repository = await github.rest.repos.get({ owner, repo });
            const base = repository.data.default_branch;
            const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${base}` });

            try {
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: ref.data.object.sha });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            const marker = '<!-- ai-team-approved-task -->';
            const body = `${marker}\n✅ **Jasmine approval bridge accepted this task.**\n\n- Task branch: \`${branch}\`\n- Base: \`${base}\`\n- Developer: **Lily — Developer**\n- Research source: the approved task document / issue body\n- Required handoff: open a PR back to \`${base}\`; do not push implementation directly to \`${base}\`.\n- Review path: PR CI → \`kitty-review\` → **Kitty — Review/Test** → Jasmine final report.\n\nThis issue is the durable task record; no user copy/paste is required between employee handoffs.`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issue.number, per_page: 100 });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body });
            }
